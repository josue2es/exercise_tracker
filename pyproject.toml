[project]
name = "gym-tracker"
version = "0.1.0"
description = "Mobile-first workout tracker with REST API and MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "nicegui==3.17.1",
    "fastmcp==4.0.5",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "mcp==2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is the framework pattern
    "DTZ",     # we deliberately store naive UTC (documented in db/models.py)
    "BLE001",  # the auth middleware intentionally treats any storage error as logged-out
    "RUF001",  # UI strings intentionally use × and – characters
    "RUF002",
    "RUF003",
    "RUF059",  # unused unpacked fixture variables in tests are fine
    "PLR0402",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"db/migrations/versions/*" = ["E501", "W291"]
"scripts/mcp_smoke_test.py" = ["E501"]
"tests/*" = ["E501"]
