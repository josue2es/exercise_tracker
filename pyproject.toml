[project]
name = "gym-tracker"
version = "0.1.0"
description = "Mobile-first workout tracker with REST API and MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "nicegui==3.17.1",
    "fastmcp==4.0.5",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "mcp==2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
